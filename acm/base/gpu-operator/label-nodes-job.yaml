---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-node-labeler
  namespace: gpu-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gpu-node-labeler
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gpu-node-labeler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gpu-node-labeler
subjects:
  - kind: ServiceAccount
    name: gpu-node-labeler
    namespace: gpu-operator
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mig-config
  namespace: gpu-operator
data:
  mig.config: |
    version: v1
    mig-configs:
      selected:
      - devices: ["0"]
        mig-enabled: true
        mig-devices:
          - name: 3g.71gb
            position: 0
            size: 4
          - name: 2g.35gb
            position: 4
            size: 2
          - name: 1g.18gb
            position: 6
            size: 1
          - name: 1g.18gb
            position: 7
            size: 1
      - devices: ["1"]
        mig-enabled: true
        mig-devices:
          - name: 3g.71gb
            position: 0
            size: 4
          - name: 2g.35gb
            position: 4
            size: 2
          - name: 1g.18gb
            position: 6
            size: 1
          - name: 1g.18gb
            position: 7
            size: 1
      - devices: ["2"]
        mig-enabled: true
        mig-devices:
          - name: 3g.71gb
            position: 0
            size: 4
          - name: 2g.35gb
            position: 4
            size: 2
          - name: 1g.18gb
            position: 6
            size: 1
          - name: 1g.18gb
            position: 7
            size: 1
      - devices: ["3"]
        mig-enabled: true
        mig-devices:
          - name: 3g.71gb
            position: 0
            size: 4
          - name: 2g.35gb
            position: 4
            size: 2
          - name: 1g.18gb
            position: 6
            size: 1
          - name: 1g.18gb
            position: 7
            size: 1
      - devices: ["4"]
        mig-enabled: true
        mig-devices:
          - name: 3g.71gb
            position: 0
            size: 4
          - name: 2g.35gb
            position: 4
            size: 2
          - name: 1g.18gb
            position: 6
            size: 1
          - name: 1g.18gb
            position: 7
            size: 1
      - devices: ["5"]
        mig-enabled: true
        mig-devices:
          - name: 3g.71gb
