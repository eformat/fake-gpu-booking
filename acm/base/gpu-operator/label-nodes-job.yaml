---
apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-node-labeler
  namespace: gpu-operator
spec:
  backoffLimit: 4
  template:
    spec:
      serviceAccountName: gpu-node-labeler
      restartPolicy: OnFailure
      volumes:
        - name: mig-config
          configMap:
            name: mig-config
      containers:
        - name: labeler
          image: registry.redhat.io/openshift4/ose-cli:latest
          volumeMounts:
            - name: mig-config
              mountPath: /config
          command:
            - /bin/bash
            - -c
            - |
              MIG_CONFIG=$(cat /config/mig.config)
              for node in $(oc get nodes -l node-role.kubernetes.io/worker --no-headers -o name); do
                echo "Labeling $node"
                oc label "$node" run.ai/simulated-gpu-node-pool=default --overwrite
                oc label "$node" node-role.kubernetes.io/runai-dynamic-mig=true --overwrite
                oc annotate "$node" "run.ai/mig.config=${MIG_CONFIG}" --overwrite
              done
