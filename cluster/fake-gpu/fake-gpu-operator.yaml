---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fake-gpu-operator
  namespace: openshift-gitops
spec:
  destination:
    namespace: gpu-operator
    server: "https://kubernetes.default.svc"
  project: default
  sources:
    - repoURL: https://github.com/eformat/fake-gpu-booking.git
      targetRevision: main
      ref: values
    - repoURL: ghcr.io/run-ai/fake-gpu-operator
      chart: fake-gpu-operator
      targetRevision: 0.4.0
      helm:
        valueFiles:
          - $values/fake-gpu-operator/values.yaml
        parameters:
          - name: environment.openshift
            value: "true"
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    managedNamespaceMetadata:
      labels:
        argocd.argoproj.io/managed-by: openshift-gitops
