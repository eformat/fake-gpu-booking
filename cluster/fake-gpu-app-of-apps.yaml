---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fake-gpu-app-of-apps
  namespace: openshift-gitops
spec:
  destination:
    namespace: openshift-gitops
    server: "https://kubernetes.default.svc"
  project: default
  source:
    path: cluster/fake-gpu
    directory:
      include: "*.yaml"
    repoURL: https://github.com/eformat/fake-gpu-booking.git
    targetRevision: main
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - ServerSideApply=true
      - Validate=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /spec/syncPolicy/automated
        - /spec/syncPolicy/ignoreDifferences
