{{- if .Values.nightly.enabled }}
---
apiVersion: operators.coreos.com/v1alpha1
kind: CatalogSource
metadata:
  name: {{ .Values.nightly.catalogSource.name }}
  namespace: openshift-marketplace
spec:
  displayName: {{ .Values.nightly.catalogSource.displayName }}
  grpcPodConfig:
    securityContextConfig: restricted
  image: {{ .Values.nightly.catalogSource.image }}
  publisher: RHOAI Development Catalog
  sourceType: grpc
  updateStrategy:
    registryPoll:
      interval: 15m
{{- end }}
