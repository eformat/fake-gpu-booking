{{- if and (ge (int .Values.installPhase) 3) .Values.odhDocument.enabled }}
---
apiVersion: dashboard.opendatahub.io/v1
kind: OdhDocument
metadata:
  name: {{ .Values.odhDocument.name }}
  namespace: {{ .Values.odhDocument.namespace }}
  annotations:
    opendatahub.io/categories: {{ .Values.odhDocument.categories | quote }}
    platform.opendatahub.io/instance.name: default-dashboard
    platform.opendatahub.io/version: 3.0.0
    platform.opendatahub.io/type: OpenShift AI Self-Managed
  labels:
    app: rhods-dashboard
    app.kubernetes.io/part-of: rhods-dashboard
    app.opendatahub.io/rhods-dashboard: "true"
    platform.opendatahub.io/part-of: dashboard
spec:
  displayName: {{ .Values.odhDocument.displayName }}
  appName: rhoai
  type: tutorial
  description: |-
    {{ .Values.odhDocument.description }}
  url: {{ .Values.odhDocument.url }}
  durationMinutes: {{ .Values.odhDocument.durationMinutes }}
{{- end }}
